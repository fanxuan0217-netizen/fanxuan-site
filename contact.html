<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系方式 — 樊轩 · WHITE BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ff6622;
  --orange-d:#e4531a;
  --black:#000;
  --ink:#0a0a0a;
  --white:#ffffff;
  --paper:#f4f1ea;
  --green:#3ddc97;
  --red:#ff6363;
  --grey:#9b9b9b;
  --disp:'Anton', 'Arial Narrow', Impact, sans-serif;
  --body:'Archivo', 'Helvetica Neue', Arial, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
.wrap{width:min(1280px,92%);margin-inline:auto}
::selection{background:var(--orange);color:#fff}

/* ============ NAV（与主站一致） ============ */
.nav{
  position:sticky;top:0;z-index:50;
  background:var(--black);
  border-bottom:1px solid #161616;
}
.nav-in{
  width:min(1280px,92%);margin-inline:auto;
  display:flex;align-items:center;justify-content:space-between;
  height:74px;gap:24px;
}
.logo{
  font-family:var(--disp);
  color:var(--orange);
  font-size:22px;line-height:.92;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.menu{display:flex;gap:44px}
.menu a{
  font-weight:700;
  font-size:15px;letter-spacing:.08em;
  color:#cfcfcf;
  padding:6px 0;
  transition:color .15s;
}
.menu a:hover{color:#fff}
.menu a.on{color:var(--orange)}

/* ============ HEAD（浅色纸面大字，呼应主站 Hero） ============ */
.head{
  background:#d9d7d2;color:#111;
  padding:64px 0 72px;
  position:relative;overflow:hidden;
}
.lab-still{
  font-weight:900;
  font-size:15px;letter-spacing:.34em;
  color:#8a8a8a;margin-bottom:18px;
}
.head-word{
  font-weight:900;
  font-size:clamp(84px,11vw,180px);
  letter-spacing:.02em;line-height:.95;color:#0d0d0d;
}
.head-word em{font-style:normal;color:var(--orange)}
.head-role{
  font-weight:700;
  font-size:clamp(15px,1.4vw,20px);
  letter-spacing:.3em;color:#1a1a1a;
  margin-top:10px;
}

/* ============ CONTACT CARDS（黑纸区四块） ============ */
.contact{padding:96px 0 120px;position:relative}
.c-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:26px;
}
.c-card{
  position:relative;
  background:#101010;
  border:1px solid #1f1f1f;
  padding:38px 36px 34px;
  overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.c-card::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;
  width:6px;background:var(--accent,var(--orange));
  transform:scaleY(0);transform-origin:top;
  transition:transform .25s;
}
.c-card:hover{border-color:var(--accent,var(--orange));transform:translateY(-4px)}
.c-card:hover::before{transform:scaleY(1)}
.c-label{
  display:flex;align-items:center;gap:12px;
  font-weight:900;font-size:14px;letter-spacing:.3em;
  color:var(--grey);text-transform:uppercase;
  margin-bottom:16px;
}
.c-dot{
  width:10px;height:10px;background:var(--accent,var(--orange));
  transform:rotate(45deg);flex:none;
}
.c-value{
  font-family:var(--disp);
  font-size:clamp(24px,2.6vw,38px);
  letter-spacing:.03em;
  color:#fff;
  line-height:1.15;
  word-break:break-all;
}
.c-value .at{color:var(--accent,var(--orange))}
.c-note{
  margin-top:10px;
  font-size:13px;color:#7c7c7c;letter-spacing:.05em;
}
.c-act{
  display:inline-block;margin-top:20px;
  font-family:var(--disp);
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent,var(--orange));
  border:1px solid var(--accent,var(--orange));
  padding:9px 20px;
  background:none;cursor:pointer;
  font-family:var(--body);font-weight:700;
  transition:background .15s,color .15s;
}
.c-act:hover{background:var(--accent,var(--orange));color:#fff}

/* 复制成功提示 */
.c-toast{
  position:fixed;left:50%;bottom:44px;transform:translate(-50%,20px);
  background:var(--orange);color:#fff;
  font-weight:700;letter-spacing:.1em;
  padding:12px 26px;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:99;
}
.c-toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ FOOTER ============ */
.footer{
  border-top:1px solid #161616;
  padding:34px 0;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.footer .logo{font-size:16px}
.footer p{font-size:12px;color:#6d6d6d;letter-spacing:.1em}
.footer a{color:#9b9b9b;font-weight:700;transition:color .15s}
.footer a:hover{color:var(--orange)}

/* ============ 响应式 ============ */
@media (max-width:760px){
  .menu{gap:20px}
  .c-grid{grid-template-columns:1fr}
  .c-card{padding:28px 24px 26px}
  .head{padding:44px 0 52px}
  .contact{padding:64px 0 80px}
}
</style>
</head>
<body>

<!-- NAV -->
<header class="nav">
  <div class="nav-in">
    <a href="index.html" class="logo">WHITE<br>BOX</a>
    <nav class="menu">
      <a href="index.html">个人简介</a>
      <a href="index.html#cards">原创IP</a>
      <a href="index.html#story">作品展示</a>
      <a class="on" href="contact.html">联系方式</a>
    </nav>
  </div>
</header>

<!-- HEAD -->
<section class="head">
  <div class="wrap">
    <p class="lab-still">联系 / Contact</p>
    <h1 class="head-word">来<em>聊</em>故事</h1>
    <p class="head-role">编剧 · 内容策划 · AI影视制作</p>
  </div>
</section>

<!-- CONTACT -->
<section class="contact">
  <div class="wrap">
    <div class="c-grid">

      <div class="c-card" style="--accent:#ff6622">
        <p class="c-label"><span class="c-dot"></span>电话 / Phone</p>
        <p class="c-value">151 1002 9269</p>
        <p class="c-note">工作日 10:00 – 22:00</p>
        <button class="c-act" data-copy="15110029269">点击复制</button>
      </div>

      <div class="c-card" style="--accent:#3ddc97">
        <p class="c-label"><span class="c-dot"></span>微信 / WeChat</p>
        <p class="c-value">fanxuan0217</p>
        <p class="c-note">添加请备注来意</p>
        <button class="c-act" data-copy="fanxuan0217">点击复制</button>
      </div>

      <div class="c-card" style="--accent:#ff6363">
        <p class="c-label"><span class="c-dot"></span>小红书 / RED</p>
        <p class="c-value"><span class="at">@</span>我是FX</p>
        <p class="c-note">原创故事连载中</p>
        <button class="c-act" data-copy="我是FX">点击复制</button>
      </div>

      <div class="c-card" style="--accent:#f4f1ea">
        <p class="c-label"><span class="c-dot"></span>邮箱 / Mail</p>
        <p class="c-value">fanxuanlll@126.com</p>
        <p class="c-note">合作与改编洽谈首选</p>
        <a class="c-act" href="mailto:fanxuanlll@126.com?subject=交流与合作">写邮件</a>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <a href="index.html" class="logo">WHITE BOX</a>
    <p>© 2026 樊轩 · 原创内容，请勿转载</p>
    <a href="index.html">← 返回主页</a>
  </div>
</footer>

<div class="c-toast" id="toast">已复制</div>

<script>
(function(){
  var toast = document.getElementById('toast');
  var timer = null;
  function showToast(msg){
    toast.textContent = msg || '已复制';
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }
  document.querySelectorAll('.c-act[data-copy]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var text = btn.getAttribute('data-copy');
      function done(){ showToast('已复制：' + text); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, function(){ fallback(text); done(); });
      }else{
        fallback(text); done();
      }
    });
  });
  function fallback(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
